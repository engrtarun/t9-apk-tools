name: Build APK & Deploy Pages

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    env:
      T9_KEYSTORE_PATH: ${{ runner.temp }}/t9-release.jks
      T9_KEYSTORE_PASSWORD: t9-apk-tools
      T9_KEY_ALIAS: t9
      T9_KEY_PASSWORD: t9-apk-tools

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Decode signing keystore
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f keystore/t9-release.jks.b64 ]; then
            echo "::error::keystore/t9-release.jks.b64 is missing from the repository."
            exit 1
          fi
          base64 -d keystore/t9-release.jks.b64 > "$RUNNER_TEMP/t9-release.jks"
          if [ ! -s "$RUNNER_TEMP/t9-release.jks" ]; then
            echo "::error::Decoded keystore is empty."
            exit 1
          fi
          echo "Keystore decoded for this run."

      - name: Read version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f VERSION ]; then
            echo "::error::VERSION file is missing."
            exit 1
          fi
          version="$(tr -d '[:space:]' < VERSION)"
          if [ -z "$version" ]; then
            echo "::error::VERSION file is empty."
            exit 1
          fi
          echo "name=$version" >> "$GITHUB_OUTPUT"
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"
          echo "Building version $version (code $GITHUB_RUN_NUMBER)."

      - name: Build release APK
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:assembleRelease --no-daemon --stacktrace --warning-mode all 2>&1 | tee "$RUNNER_TEMP/gradle-build.log"

      - name: Verify APK signature
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$apk" ]; then
            echo "::error::Release APK was not produced at $apk."
            exit 1
          fi

          if [ -n "${ANDROID_HOME:-}" ] && [ -x "$ANDROID_HOME/build-tools/34.0.0/apksigner" ]; then
            apksigner="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          else
            apksigner="$(command -v apksigner || true)"
          fi
          if [ -z "$apksigner" ] || [ ! -x "$apksigner" ]; then
            echo "::error::apksigner was not found in the Android SDK or on PATH."
            exit 1
          fi

          "$apksigner" verify --print-certs "$apk" | tee "$RUNNER_TEMP/apksigner.log"
          signer="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/apksigner.log" | head -n 1 | tr -d '[:space:]')"
          if [ -z "$signer" ]; then
            echo "::error::Could not read the signer SHA-256 digest from apksigner."
            exit 1
          fi

          echo "signer=$signer" >> "$GITHUB_OUTPUT"
          echo "SIGNER_SHA256=$signer" >> "$GITHUB_ENV"
          echo "APK_SHA256=$(sha256sum "$apk" | awk '{print $1}')" >> "$GITHUB_ENV"
          echo "APK_SIZE=$(stat -c%s "$apk")" >> "$GITHUB_ENV"
          echo "APK signature verified."

      - name: Prepare Pages payload
        shell: bash
        env:
          APP_VERSION: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ github.run_number }}
          SIGNER_SHA256: ${{ steps.verify.outputs.signer }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/release/app-release.apk"
          mkdir -p site/download
          cp "$apk" site/download/t9-apk-tools.apk

          size_bytes="$(stat -c%s site/download/t9-apk-tools.apk)"
          sha256="$(sha256sum site/download/t9-apk-tools.apk | awk '{print $1}')"
          built_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          release_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/v${APP_VERSION}"

          export SIZE_BYTES="$size_bytes"
          export SHA256="$sha256"
          export BUILT_AT="$built_at"
          export RUN_URL="$run_url"
          export RELEASE_URL="$release_url"

          python3 - <<'PY'
          import json
          import os

          data = {
              "version": os.environ["APP_VERSION"],
              "versionCode": int(os.environ["VERSION_CODE"]),
              "sizeBytes": int(os.environ["SIZE_BYTES"]),
              "sha256": os.environ["SHA256"],
              "signerSha256": os.environ["SIGNER_SHA256"],
              "builtAt": os.environ["BUILT_AT"],
              "commit": os.environ["COMMIT_SHA"],
              "runUrl": os.environ["RUN_URL"],
              "releaseUrl": os.environ["RELEASE_URL"],
          }

          with open("site/download/version.json", "w", encoding="utf-8") as handle:
              json.dump(data, handle, indent=2)
              handle.write("\n")
          PY

          python3 -m json.tool site/download/version.json > /dev/null
          echo "Pages payload prepared."

      - name: Write job summary
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          pages_url="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/"
          {
            echo "## T9 APK Tools ${APP_VERSION}"
            echo ""
            echo "| Item | Value |"
            echo "| --- | --- |"
            echo "| Version | \`${APP_VERSION}\` |"
            echo "| Version code | \`${GITHUB_RUN_NUMBER}\` |"
            echo "| APK size | \`${APK_SIZE}\` bytes |"
            echo "| SHA-256 | \`${APK_SHA256}\` |"
            echo "| Signer SHA-256 | \`${SIGNER_SHA256}\` |"
            echo "| Commit | \`${GITHUB_SHA}\` |"
            echo "| Pages | ${pages_url} |"
            echo "| Run | ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: t9-apk-tools-apk
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Write failure summary
        if: failure()
        shell: bash
        run: |
          set -uo pipefail
          {
            echo "## Build failed"
            echo ""
            echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo ""
            if [ -f "$RUNNER_TEMP/gradle-build.log" ]; then
              echo "Last 120 lines of the Gradle log:"
              echo ""
              echo '```text'
              tail -n 120 "$RUNNER_TEMP/gradle-build.log"
              echo '```'
            else
              echo "No Gradle log was produced. Open the job log for details."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: t9-apk-tools-apk
          path: dist

      - name: Rename release asset
        shell: bash
        run: |
          set -euo pipefail
          mv dist/app-release.apk dist/t9-apk-tools.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/t9-apk-tools.apk
          generate_release_notes: true
