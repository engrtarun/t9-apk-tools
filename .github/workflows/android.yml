name: Build APK & Deploy Pages

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    env:
      T9_KEYSTORE_PASSWORD: t9-apk-tools
      T9_KEY_ALIAS: t9
      T9_KEY_PASSWORD: t9-apk-tools

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      # ubuntu-latest ships with the Android SDK and accepted licenses.
      # Let AGP resolve the exact platform/build-tools it needs.

      - name: Decode signing keystore
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f keystore/t9-release.jks.b64 ]; then
            echo "::error::keystore/t9-release.jks.b64 is missing from the repository."
            exit 1
          fi
          base64 -d keystore/t9-release.jks.b64 > "$RUNNER_TEMP/t9-release.jks"
          if [ ! -s "$RUNNER_TEMP/t9-release.jks" ]; then
            echo "::error::Decoded keystore is empty."
            exit 1
          fi
          echo "Keystore decoded for this run."

      - name: Read version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f VERSION ]; then
            echo "::error::VERSION file is missing."
            exit 1
          fi
          version="$(tr -d '[:space:]' < VERSION)"
          if [ -z "$version" ]; then
            echo "::error::VERSION file is empty."
            exit 1
          fi
          echo "name=$version" >> "$GITHUB_OUTPUT"
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"
          echo "Building version $version."
          if [[ "$GITHUB_REF" == refs/tags/v* && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match VERSION (v$version)."
            exit 1
          fi

      - name: Build release APK
        shell: bash
        env:
          T9_KEYSTORE_PATH: ${{ runner.temp }}/t9-release.jks
        run: |
          set -euo pipefail
          gradle :app:assembleRelease --no-daemon --stacktrace --warning-mode all 2>&1 | tee "$RUNNER_TEMP/gradle-build.log"

      - name: Verify APK signature
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$apk" ]; then
            echo "::error::Release APK was not produced at $apk."
            exit 1
          fi

          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          apksigner="$(find "$sdk_root/build-tools" -type f -name apksigner 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$apksigner" ] || [ ! -x "$apksigner" ]; then
            echo "::error::apksigner was not found under $sdk_root/build-tools."
            exit 1
          fi

          "$apksigner" verify --print-certs "$apk" | tee "$RUNNER_TEMP/apksigner.log"
          # Build-tools versions differ slightly in this line, so match the label and
          # take everything after the final colon instead of a fixed prefix.
          signer="$(grep -i 'certificate SHA-256 digest' "$RUNNER_TEMP/apksigner.log" \
            | head -n 1 | sed 's/.*: *//' | tr -d '[:space:]')"
          if [ -z "$signer" ]; then
            echo "::error::Could not read the signer SHA-256 digest from apksigner."
            echo "--- apksigner output ---"
            cat "$RUNNER_TEMP/apksigner.log"
            exit 1
          fi

          echo "signer=$signer" >> "$GITHUB_OUTPUT"
          echo "SIGNER_SHA256=$signer" >> "$GITHUB_ENV"
          echo "APK_SHA256=$(sha256sum "$apk" | awk '{print $1}')" >> "$GITHUB_ENV"
          echo "APK_SIZE=$(stat -c%s "$apk")" >> "$GITHUB_ENV"
          echo "APK signature verified."

      - name: Prepare Pages payload
        shell: bash
        env:
          APP_VERSION: ${{ steps.version.outputs.name }}
          SIGNER_SHA256: ${{ steps.verify.outputs.signer }}
          COMMIT_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/release/app-release.apk"
          mkdir -p site/download
          cp "$apk" site/download/t9-apk-tools.apk

          # The manifest must describe the APK it ships, so read the code out of
          # the built binary instead of trusting a separate number.
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          aapt2="$(find "$sdk_root/build-tools" -type f -name aapt2 2>/dev/null | sort -V | tail -n 1)"
          version_code=""
          if [ -n "$aapt2" ]; then
            version_code="$("$aapt2" dump badging "$apk" 2>/dev/null \
              | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" | head -n 1)"
          fi
          if [ -z "$version_code" ]; then
            version_code="$(python3 -c 'import os; p = os.environ["APP_VERSION"].split("."); print(int(p[0]) * 10000 + int(p[1]) * 100 + int(p[2]))')"
          fi

          size_bytes="$(stat -c%s site/download/t9-apk-tools.apk)"
          sha256="$(sha256sum site/download/t9-apk-tools.apk | awk '{print $1}')"
          built_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          release_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases"
          if curl -fsS -o /dev/null \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/v${APP_VERSION}"; then
            release_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/v${APP_VERSION}"
          else
            echo "No published release for v${APP_VERSION} yet; linking the release list."
          fi

          echo "APP_VERSION_CODE=$version_code" >> "$GITHUB_ENV"
          export VERSION_CODE="$version_code"
          export SIZE_BYTES="$size_bytes"
          export SHA256="$sha256"
          export BUILT_AT="$built_at"
          export RUN_URL="$run_url"
          export RELEASE_URL="$release_url"
          echo "Pages manifest: ${APP_VERSION} (code ${version_code}), ${size_bytes} bytes."

          python3 - <<'PY'
          import json
          import os

          data = {
              "version": os.environ["APP_VERSION"],
              "versionCode": int(os.environ["VERSION_CODE"]),
              "sizeBytes": int(os.environ["SIZE_BYTES"]),
              "sha256": os.environ["SHA256"],
              "signerSha256": os.environ["SIGNER_SHA256"],
              "builtAt": os.environ["BUILT_AT"],
              "commit": os.environ["COMMIT_SHA"],
              "runUrl": os.environ["RUN_URL"],
              "releaseUrl": os.environ["RELEASE_URL"],
          }

          with open("site/download/version.json", "w", encoding="utf-8") as handle:
              json.dump(data, handle, indent=2)
              handle.write("\n")
          PY

          python3 -m json.tool site/download/version.json > /dev/null
          echo "Pages payload prepared."

      - name: Write job summary
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          pages_url="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/"
          {
            echo "## T9 APK Tools ${APP_VERSION}"
            echo ""
            echo "| Item | Value |"
            echo "| --- | --- |"
            echo "| Version | \`${APP_VERSION}\` |"
            echo "| Version code | \`${APP_VERSION_CODE}\` |"
            echo "| APK size | \`${APK_SIZE}\` bytes |"
            echo "| SHA-256 | \`${APK_SHA256}\` |"
            echo "| Signer SHA-256 | \`${SIGNER_SHA256}\` |"
            echo "| Commit | \`${GITHUB_SHA}\` |"
            echo "| Pages | ${pages_url} |"
            echo "| Run | ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: t9-apk-tools-apk
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Write failure summary
        if: failure()
        shell: bash
        run: |
          set -uo pipefail
          {
            echo "## Build failed"
            echo ""
            echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo ""
            if [ -f "$RUNNER_TEMP/gradle-build.log" ]; then
              echo "Last 120 lines of the Gradle log:"
              echo ""
              echo '```text'
              tail -n 120 "$RUNNER_TEMP/gradle-build.log"
              echo '```'
            else
              echo "No Gradle log was produced. Open the job log for details."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: t9-apk-tools-apk
          path: dist

      - name: Rename release asset
        shell: bash
        run: |
          set -euo pipefail
          mv dist/app-release.apk dist/t9-apk-tools.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/t9-apk-tools.apk
          generate_release_notes: true
